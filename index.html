<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Belépés kód alapján</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      margin: 1rem 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 0.6rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .hidden {
      display: none;
    }
    #error-msg {
      color: red;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Belépő doboz -->
  <div class="card" id="login-section">
    <h2>Belépés</h2>
    <input type="text" id="access-code" placeholder="Add meg a belépési kódot">
    <button onclick="handleLogin()">Belépés</button>
    <p id="error-msg" class="hidden">Érvénytelen kód!</p>
  </div>

  <!-- Belépés után megjelenő felület -->
  <div class="card hidden" id="welcome-section">
    <h2>Üdvözlünk!</h2>
    <p>Bejelentkezve mint: <strong id="user-display"></strong></p>
    <button onclick="handleLogout()">Kijelentkezés</button>
  </div>

  <script>
    // Kód -> Név hozzárendelés
    const USER_DATABASE = {
      "KOD123": "Kovács Péter",
      "ADMIN99": "Admin Felhasználó",
      "TESZT42": "Minta Anna"
    };

    function handleLogin() {
      const codeInput = document.getElementById("access-code").value.trim().toUpperCase();
      const errorMsg = document.getElementById("error-msg");

      if (USER_DATABASE[codeInput]) {
        const userName = USER_DATABASE[codeInput];
        
        // Név megjelenítése és felület váltása
        document.getElementById("user-display").textContent = userName;
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("welcome-section").classList.remove("hidden");
        errorMsg.classList.add("hidden");
      } else {
        errorMsg.classList.remove("hidden");
      }
    }

    function handleLogout() {
      document.getElementById("access-code").value = "";
      document.getElementById("welcome-section").classList.add("hidden");
      document.getElementById("login-section").classList.remove("hidden");
    }
  </script>

</body>
</html>
